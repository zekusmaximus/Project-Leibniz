name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: server (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # No server test suite yet: syntax-check the entry points (does not execute
      # them, so no DB/env is needed) and verify the canonical seed graph loads.
      - run: node --check index.js
      - run: node --check seed.js
      - run: node --check config.js
      - run: node -e "const g=require('./storyGraph'); if (!g.nodes.length || !g.links.length) { throw new Error('seed graph is empty'); }"
